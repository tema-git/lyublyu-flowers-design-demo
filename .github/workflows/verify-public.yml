          def check(job):
              site, base, item = job
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(base+item['path'],headers={'User-Agent':'WebsiteDeploymentCheck/1.0','Accept-Encoding':'identity'})
                      with urllib.request.urlopen(request,timeout=12) as r:
                          body=r.read(); status=r.status
                      actual=hashlib.sha256(body).hexdigest()
                      if status==200 and actual==item['sha256']: return {'site':site,'path':item['path'],'ok':True,'status':status}
                      error='HTTP '+str(status)+' or hash mismatch'
                  except Exception as e: error=str(e)
                  if attempt<2:time.sleep(4)
              return {'site':site,'path':item['path'],'ok':False,'error':error}
          jobs=[(s['site'],s['url'],f) for s in manifest for f in s['files']]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool: results=list(pool.map(check,jobs))
